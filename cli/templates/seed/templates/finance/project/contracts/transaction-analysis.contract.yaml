name: transaction-analysis
version: 1
schema:
  required_fields:
    - transactions
    - totals_by_category
    - summary
  fields:
    transactions:
      type: array
      items:
        type: object
        required_fields:
          - date
          - description
          - amount_cents
          - category
tool_calls:
  minimum: 1
  required_tools:
    - repo_manager.read_file

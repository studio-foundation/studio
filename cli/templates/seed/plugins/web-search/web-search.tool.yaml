name: web-search
description: Search the web using Tavily (requires TAVILY_API_KEY)
version: 1

commands:
  - name: web_search-search
    description: Search the web and return relevant results
    parameters:
      query:
        type: string
        required: true
        description: The search query
      max_results:
        type: number
        required: false
        description: "Maximum number of results to return (default: 5)"
    execute:
      type: shell
      # The body goes through a quoted heredoc so a query containing quotes
      # cannot break out of the command.
      command: |
        curl -sS -X POST https://api.tavily.com/search \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $TAVILY_API_KEY" \
          --data-binary @- <<'TAVILY_REQUEST'
        {"query": {{query | json}}, "max_results": {{#if max_results}}{{max_results}}{{else}}5{{/if}}}
        TAVILY_REQUEST
      parse_output: json

prompt_snippet: |
  You have access to a web search tool. Use it to find up-to-date information from the web.
  Search in the language most relevant to the query.
  Prefer specific, targeted queries over broad ones for better results.

constraints:
  requires_binaries: [curl]

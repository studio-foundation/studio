name: search
description: Search the codebase by content or file pattern
version: 1

commands:
  - name: search-search_codebase
    description: Search files by content pattern (uses ripgrep)
    parameters:
      pattern:
        type: string
        required: true
        description: Regex or literal pattern to search for
      file_pattern:
        type: string
        required: false
        description: Glob pattern to restrict which files are searched (e.g. "*.ts")
    execute:
      type: shell
      # `|| true` — ripgrep exits 1 on "no matches", which is a result, not a failure.
      command: |
        rg --line-number --no-heading --max-count 50 {{#if file_pattern}}--glob "{{file_pattern}}"{{/if}} -e "{{pattern}}" . || true
      parse_output: text

prompt_snippet: |
  You have access to a codebase search tool. Use it to find relevant code before making changes.
  Results come back as `path:line:content` lines, capped at 50 matches per file.

constraints:
  requires_binaries: [rg]

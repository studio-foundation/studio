name: noninteractive-ask
description: STU-1675 fixture — interactive:false must suppress the ask prompt even under a real TTY.
version: 1
stages:
  - name: touch
    kind: run
    agent: runner
    contract: ask-output
    hooks:
      pre_tool_use:
        - matcher: noop-run_command
          command: 'echo "run the noop command?" >&2; exit 1'
          on_failure: ask
    ralph:
      max_attempts: 1
      retry_strategy: none
    context:
      include: [input]

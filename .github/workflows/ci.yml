name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build, Typecheck & Test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check the kernel names no domain tool (INV-11)
        run: pnpm check:kernel

      - name: Check the invariants a grep can settle (INV-04/05/06/10/12)
        run: pnpm check:invariants

      - name: Build all packages
        run: pnpm build

      - name: Typecheck all packages
        run: pnpm -r --if-present run typecheck

      - name: Run tests
        run: pnpm test

  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Reads every file in .github/workflows/, including the dispatch-only publish
      # ones no PR would otherwise exercise.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      # actionlint is offline: a pin that does not exist still lints clean.
      - name: Check every action reference resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          while read -r file ref; do
            if gh api "repos/${ref%@*}/commits/${ref#*@}" --silent; then
              echo "ok            $ref ($file)"
            else
              echo "unresolvable: $ref in $file"
              rc=1
            fi
          done < <(grep -roE 'uses: [^ ]+@[^ ]+' .github/workflows/ | sed 's/:uses: / /' | sort -u)
          exit $rc

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build, Typecheck & Test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check the kernel names no domain tool (INV-11)
        run: pnpm check:kernel

      - name: Check the invariants a grep can settle (INV-04/05/06/10/12)
        run: pnpm check:invariants

      - name: Build all packages
        run: pnpm build

      - name: Typecheck all packages
        run: pnpm -r --if-present run typecheck

      - name: Run tests
        run: pnpm test

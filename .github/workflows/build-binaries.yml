name: Build binaries

# Reusable: compiles the standalone CLI for every platform and leaves the results
# in `binaries-*` artifacts for the calling workflow to publish.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Bun cross-compiles every non-Apple target from one Linux runner.
          - os: ubuntu-24.04
            platforms: linux-x64 linux-x64-baseline linux-x64-musl linux-arm64 linux-arm64-musl win-x64
          # macOS refuses to launch an unsigned Mach-O binary, so those are built on
          # a macOS runner where `codesign` is available.
          - os: macos-14
            platforms: darwin-arm64 darwin-x64
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Compile binaries
        run: node scripts/build-binary.mjs ${{ matrix.platforms }}

      # Decision: staying ad-hoc, not moving to a paid Developer ID + notarization.
      # install.sh (the only documented install path) never sets com.apple.quarantine,
      # so Gatekeeper never runs and this is enough. A browser download from this repo's
      # Releases page *does* get quarantined and Gatekeeper hard-blocks it (verified on a
      # real Mac: SIGKILL on direct exec, "cannot be opened" dialog with no Open Anyway on
      # GUI open, only Trash-or-OK) — but that path isn't documented or linked anywhere,
      # so we're accepting the risk rather than paying for notarization. Revisit if this CLI
      # ever grows an audience that reaches Releases directly instead of through install.sh.
      - name: Ad-hoc sign macOS binaries
        if: runner.os == 'macOS'
        run: codesign --sign - --force dist-binaries/studio-darwin-*

      # `bun build --compile` exiting 0 does not mean the bundle starts: a missing
      # bundled asset or a `require` Bun could not statically resolve only fails at
      # load time. Run every binary the runner can execute natively, and compare the
      # printed version against cli/package.json — a stale inlined version starts fine.
      #
      # Unverified, no runner here can execute them: linux-arm64, linux-arm64-musl,
      # win-x64 (cross-compiled from Linux) and darwin-x64 (macos-14 is Apple Silicon,
      # without Rosetta).
      - name: Smoke-test compiled binaries
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node -p "require('./cli/package.json').version")

          assert_version() {
            local label=$1; shift
            local actual
            actual=$("$@" | tr -d '\r')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label printed version '$actual', expected '$expected'"
              exit 1
            fi
            echo "$label -> $actual"
          }

          if [ "$RUNNER_OS" = macOS ]; then
            assert_version darwin-arm64 dist-binaries/studio-darwin-arm64 --version
          else
            assert_version linux-x64 dist-binaries/studio-linux-x64 --version
            # The baseline build runs anywhere the default one does, so this runner
            # proves it starts — not that it starts without AVX2, which no runner can.
            assert_version linux-x64-baseline dist-binaries/studio-linux-x64-baseline --version
            # Bun links the musl build against libstdc++, which a bare Alpine lacks.
            assert_version linux-x64-musl \
              docker run --rm -v "$PWD/dist-binaries:/b" alpine:3.20 \
              sh -c 'apk add --no-cache libstdc++ >/dev/null && /b/studio-linux-x64-musl --version'
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: dist-binaries/studio-*
          if-no-files-found: error

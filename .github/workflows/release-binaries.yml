name: Release binaries

# Attaches the standalone binaries to a GitHub Release. Releases are immutable in this
# repo — a published release rejects asset uploads with HTTP 422 — so this runs against
# a *draft* release, which the release procedure publishes afterwards. That is also why
# there is no `release: published` trigger: by then it is too late to upload.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to attach binaries to (e.g. v0.10.1)
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist-binaries
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist-binaries
        run: |
          sha256sum studio-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        run: gh release upload "$TAG" dist-binaries/* --clobber --repo "$GITHUB_REPOSITORY"
